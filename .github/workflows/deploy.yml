name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sgi_system
          POSTGRES_USER: sgi_admin
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgi_admin -d sgi_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sgi_system
      SPRING_DATASOURCE_USERNAME: sgi_admin
      SPRING_DATASOURCE_PASSWORD: ci_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar tests
        run: ./mvnw -B verify

  deploy:
    name: Deploy a producción
    needs: test
    # Solo despliega en push a main y únicamente si los tests pasaron
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 144.91.66.205
          username: sgi-deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: /opt/sgi/deploy.sh
