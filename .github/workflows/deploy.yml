name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Los tests de integración levantan Postgres con Testcontainers (Docker ya viene en el runner)
      - name: Compilar y ejecutar tests
        run: ./mvnw -B verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/

  deploy:
    name: Deploy a producción
    needs: test
    # Solo despliega en push a main y únicamente si los tests pasaron
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 144.91.66.205
          username: sgi-deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: /opt/sgi/deploy.sh
